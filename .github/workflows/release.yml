name: Release
on:
  push:
    tags: ["v*.*.*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Le tag correspond à la version de Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "Tag ($TAG) != Cargo.toml ($CRATE_VERSION)"; exit 1
          fi

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Vérification d'API publique (semver)
        uses: obi1kenobi/cargo-semver-checks-action@v2
      - run: cargo publish --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write      # nécessaire au Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
