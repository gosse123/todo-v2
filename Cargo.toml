[package]
name = "todo-gosse"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["nahounou gosse"]
description = "Une application CLI de gestion de tâches"
license = "MIT"
repository = "https://github.com/gosse123/todo-v2"
readme = "README.md"
keywords = ["cli", "todo"]
categories = ["command-line-utilities"]
exclure = [".github/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "3.1.1"
dialoguer = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
directories = "6"
chrono = { version = "0.4.45", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
